; Next Respack 推荐的 PHP 配置片段
; 共享主机请在控制面板修改；VPS 可放入 /etc/php/8.3/fpm/conf.d/99-nextrespack.ini

upload_max_filesize = 512M
post_max_size = 520M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_file_uploads = 20

; 下载大文件时避免输出缓冲占满内存
output_buffering = 4096
zlib.output_compression = Off

; 会话与上传临时目录需可写
; session.save_path = "/var/lib/php/sessions"
; upload_tmp_dir = "/tmp"

; 生产环境关闭错误显示
display_errors = Off
log_errors = On
expose_php = Off
