# Next Respack - Apache 站点配置示例
# 复制到 /etc/apache2/sites-available/next-respack.conf 并启用 mod_rewrite。

<VirtualHost *:80>
    ServerName respack.example.com
    DocumentRoot /var/www/next-respack/public

    <Directory /var/www/next-respack/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # 应用目录不在文档根内，以下仅为额外防线
    <Directory /var/www/next-respack/storage>
        Require all denied
    </Directory>

    <Directory /var/www/next-respack/vendor>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/next-respack-error.log
    CustomLog ${APACHE_LOG_DIR}/next-respack-access.log combined

    # 大文件上传
    LimitRequestBody 0

    # 安全头
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # 静态资源缓存
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|svg|woff2)$">
        Header set Cache-Control "public, max-age=2592000"
    </LocationMatch>

    # Apache 不支持 X-Accel-Redirect，请在后台使用 PHP 流式下载模式。
</VirtualHost>
