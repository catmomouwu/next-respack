# Next Respack - Nginx 站点配置示例
# 复制到 /etc/nginx/sites-available/next-respack.conf 并按需修改。

server {
    listen 80;
    listen [::]:80;
    server_name respack.example.com;

    # 强制 HTTPS（证书就绪后启用）
    # return 301 https://$host$request_uri;

    root /var/www/next-respack/public;
    index index.php;
    charset utf-8;

    client_max_body_size 512m;
    client_body_timeout 300s;
    send_timeout 300s;

    access_log /var/log/nginx/next-respack.access.log;
    error_log  /var/log/nginx/next-respack.error.log;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt {
        try_files $uri /index.php?$query_string;
        access_log off;
        log_not_found off;
    }

    # 静态资源缓存
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }

    # X-Accel-Redirect 内部下载（后台“下载模式”设为 x-accel 时使用）
    # alias 必须与后台存储设置中的“本地存储目录”一致。
    location ^~ /_protected/respack/ {
        internal;
        alias /var/www/next-respack/storage/app/private/resource-packs/;
    }

    # 禁止访问隐藏文件与敏感路径（应用目录本就在文档根之外）
    location ~ /\.(?!well-known) {
        deny all;
    }
}

