; Next Respack - PHP limits for shared hosting (PHP-FPM / CGI).
; Hosts that ignore .user.ini can set the same values in the control panel.

upload_max_filesize = 512M
post_max_size = 520M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

display_errors = Off
log_errors = On
expose_php = Off
